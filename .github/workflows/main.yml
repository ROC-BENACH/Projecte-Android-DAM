name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Missatge inicial
        run: echo "Iniciant el procés per a ROC-BENACH..."

      - name: Build and Test
        run: ./gradlew test

      - name: Missatge final
        run: echo "El Pipeline ha acabat."